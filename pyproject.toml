[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simpro-cli"
version = "1.0.0"
description = "Unofficial command-line access to the simPRO REST API, built for Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/msnimbal/simpro-cli"

[project.scripts]
simpro = "simpro_cli:main"

[tool.setuptools]
py-modules = ["simpro_cli"]
